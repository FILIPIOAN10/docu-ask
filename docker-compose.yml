services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: docuask
      POSTGRES_PASSWORD: docuask
      POSTGRES_DB: docuask
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docuask -d docuask"]
      interval: 5s
      timeout: 3s
      retries: 10

  # one-shot job: applies the migrations and exits. The API starts only after it finished successfully.
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://docuask:docuask@db:5432/docuask
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://docuask:docuask@db:5432/docuask
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata: