[project]
name = "docuask"
version = "0.1.0"
description = "RAG API over company documents: FastAPI + LangChain + pgvector"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.20",
    "pydantic-settings>=2.10",
    "sqlalchemy>=2.0.40",
    "psycopg[binary]>=3.2",
    "pgvector>=0.4",
    "alembic>=1.16",
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "langchain-text-splitters>=1.0",
    "pypdf>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "httpx>=0.28",
    "testcontainers[postgres]>=4.10",
    "fpdf2>=2.8",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docuask"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]